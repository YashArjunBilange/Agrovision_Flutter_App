name: agrovision
description: "AgroVision: AI-Powered Maize Farming Assistant for Indian Agriculture"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  # State Management & Routing
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1

  # Network & API
  dio: ^5.8.0+1
  http_parser: ^4.1.2

  # Secure Storage & Persistence
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.3.5

  # UI / UX, Icons, Fonts & Charts
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  fl_chart: ^0.70.2
  cached_network_image: ^3.4.1

  # Media & Hardware Integration
  image_picker: ^1.1.2
  flutter_tts: ^4.2.3
  geolocator: ^13.0.2
  url_launcher: ^6.3.1
  uuid: ^4.5.1
  google_maps_flutter: ^2.18.0
  maps_toolkit: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
